<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
  <div *ngFor="let t of toasts" class="toast align-items-center text-white border-0 mb-2"
    [class.bg-success]="t.type === 'success'" [class.bg-danger]="t.type === 'error'" [class.show]="t.visible"
    [class.fade]="true" role="alert">

    <div class="d-flex">
      <div class="toast-body">
        {{ t.message }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="t.visible = false">
      </button>
    </div>

  </div>
</div>


<div class="container-fluid mt-4">

  <div *ngIf="!loading && carbody_data" class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h3 class="fw-bold mb-1">
        <i class="bi bi-truck text-primary me-2"></i>
        {{ carbody_data.placa }}
      </h3>
      <small class="text-muted">
        Detalle completo de la carrocería
      </small>
    </div>

    <a class="btn btn-primary btn-sm shadow-sm" [routerLink]="['/carbodies/list']">
      <i class="bi bi-arrow-left me-1"></i> Volver
    </a>

  </div>

  <div *ngIf="loading" class="text-center py-5">
    <c-spinner color="primary"></c-spinner>
  </div>

  <div class="card border-0 shadow-sm rounded-3 mb-4" *ngIf="!loading && carbody_data">

    <div class="card-header bg-white border-bottom">
      <ul class="nav nav-tabs card-header-tabs">

        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#info">
            <i class="bi bi-info-circle me-1"></i> Información
          </button>
        </li>

        <!-- Estado -->
        <li class="nav-item ms-auto me-2">

          <span class="badge ms-2 text-uppercase" [ngClass]="carbody_data.estado_carbody === 'Activo'
      ? 'bg-success'
      : 'bg-danger'">

            {{ carbody_data.estado_carbody }}

          </span>
        </li>

      </ul>
    </div>

    <div class="card-body">
      <div class="tab-content">

        <div class="tab-pane fade show active" id="info">
          <div class="row g-4">

            <div class="col-md-6">
              <label class="form-label fw-semibold">Placa</label>
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-light">
                  <i class="bi bi-upc-scan text-primary"></i>
                </span>
                <input type="text" class="form-control" [value]="carbody_data.placa" disabled>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Capacidad</label>
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-light">
                  <i class="bi bi-box-seam text-primary"></i>
                </span>
                <input type="number" class="form-control" [value]="carbody_data.capacidad" disabled>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Descripción</label>
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-light">
                  <i class="bi bi-chat-left-text text-primary"></i>
                </span>
                <textarea class="form-control" rows="4" [value]="carbody_data.descripcion" disabled></textarea>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Creado</label>
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-light">
                  <i class="bi bi-calendar-plus text-primary"></i>
                </span>
                <input type="text" class="form-control" [value]="carbody_data.created_at | date:'dd/MM/yyyy HH:mm'"
                  disabled>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Actualizado</label>
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-light">
                  <i class="bi bi-calendar-check text-primary"></i>
                </span>
                <input type="text" class="form-control" [value]="carbody_data.updated_at | date:'dd/MM/yyyy HH:mm'"
                  disabled>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

  </div>

</div>
