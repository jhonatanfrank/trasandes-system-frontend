<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
  <div *ngFor="let t of toasts" class="toast align-items-center text-white border-0 mb-2"
    [class.bg-success]="t.type === 'success'" [class.bg-danger]="t.type === 'error'" [class.show]="t.visible"
    [class.fade]="true" role="alert">

    <div class="d-flex">
      <div class="toast-body">
        {{ t.message }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="t.visible = false">
      </button>
    </div>

  </div>
</div>

<!-- 🔥 LOADING INICIAL -->
<div *ngIf="loadingData" class="text-center my-5">
  <c-spinner color="primary"></c-spinner>
  <p class="mt-2 text-muted">Cargando datos...</p>
</div>

<div *ngIf="!loadingData">

  <div class="container-fluid mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

      <div>
        <h3 class="fw-bold mb-1">
          <i class="bi bi-truck text-primary me-2"></i>
          Actualizar Carrocería
        </h3>
        <small class="text-muted">Modifica los datos de la carrocería</small>
      </div>

      <a class="btn btn-outline-secondary btn-sm" [routerLink]="['/carbodies/list']">
        <i class="bi bi-arrow-left me-1"></i> Volver
      </a>

    </div>

    <!-- CARD -->
    <div class="card shadow-sm border-0">

      <div class="card-body">

        <form [formGroup]="form" (ngSubmit)="submit()">

          <div class="row g-4">

            <!-- PLACA -->
            <div class="col-md-6">

              <label class="form-label fw-semibold">Placa</label>

              <div class="input-group">

                <span class="input-group-text">
                  <i class="bi bi-upc-scan text-primary"></i>
                </span>

                <input type="text" class="form-control" formControlName="placa"
                  [class.is-invalid]="form.get('placa')?.invalid && (form.get('placa')?.touched || form.get('placa')?.dirty)"
                  [class.is-valid]="placaValid === true" placeholder="Ingrese la placa">

                <!-- 🔥 SPINNER CHECK -->
                <span class="input-group-text" *ngIf="isCheckingPlaca">
                  <c-spinner size="sm" color="primary"></c-spinner>
                </span>

              </div>

              <!-- ERRORES -->
              <div class="text-danger mt-1" *ngIf="form.get('placa')?.touched && form.get('placa')?.invalid">

                <div *ngIf="form.get('placa')?.hasError('required')">Requerido</div>
                <div *ngIf="form.get('placa')?.hasError('minlength')">Mín 6 caracteres</div>
                <div *ngIf="form.get('placa')?.hasError('maxlength')">Máx 7 caracteres</div>
                <div *ngIf="form.get('placa')?.hasError('pattern')">Solo letras y números</div>

                <div *ngIf="form.get('placa')?.hasError('placaExistente')">
                  La placa ya existe
                </div>

              </div>

            </div>

            <!-- CAPACIDAD -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Capacidad</label>
              <input type="number" class="form-control" formControlName="capacidad">
            </div>

            <!-- DESCRIPCIÓN -->
            <div class="col-12">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea class="form-control" rows="4" formControlName="descripcion"></textarea>
            </div>

            <!-- ESTADO -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Estado</label>
              <select class="form-control" formControlName="estado_carbody">
                <option value="" disabled selected>
                  Seleccione un estado
                </option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>

          </div>

          <!-- ACTIONS -->
          <div class="d-flex justify-content-end mt-4 gap-2">

            <button type="button" class="btn btn-outline-secondary" (click)="reset()">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Restaurar
            </button>

            <button type="submit" class="btn btn-primary" [disabled]="loading">
              <i class="bi bi-save me-1"></i>
              {{ loading ? 'Actualizando...' : 'Actualizar' }}
            </button>

          </div>

        </form>

      </div>
    </div>

  </div>

</div>
