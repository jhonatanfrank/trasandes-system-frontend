<!-- SPINNER -->
<div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>
</div>

<div class="card mb-4" *ngIf="!loading">

    <div class="card-header">
        <h4 class="mb-0">👨‍✈️ Licencias por Vencer</h4>
    </div>

    <div class="card-body position-relative">

        <!-- TABLE -->
        <div *ngIf="!loading" class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Conductor</th>
                        <th>Licencia</th>
                        <th>Fecha Vencimiento</th>
                        <th>Días Restantes</th>
                        <th>Estado</th>
                    </tr>
                </thead>

                <tbody>

                    <tr *ngFor="let item of licencias; let i = index">

                        <td>{{ i + 1 }}</td>

                        <td>{{ item.conductor }}</td>

                        <td>
                            <span class="badge bg-primary">
                                {{ item.licencia }}
                            </span>
                        </td>

                        <td>
                            {{ item.fecha_vencimiento | date:'yyyy-MM-dd' }}
                        </td>

                        <td>
                            {{ calcularDias(item.fecha_vencimiento) }}
                        </td>

                        <td>
                            <span class="badge" [ngClass]="getBadgeClass(item.fecha_vencimiento)">
                                {{ getEstadoTexto(item.fecha_vencimiento) }}
                            </span>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>
</div>
