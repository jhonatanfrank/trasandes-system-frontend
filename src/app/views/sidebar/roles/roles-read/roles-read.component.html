<div *ngIf="loading" class="text-center mt-4">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>

    <p class="mt-2 text-muted">
        Cargando Rol y Permisos...
    </p>
</div>

<div *ngIf="!loading && role_data" class="container-fluid px-4 mt-4 mb-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-shield-lock text-primary me-2"></i>
                {{ role_data.name }}
            </h3>

            <small class="text-muted">
                Detalle completo del rol
            </small>
        </div>

        <a class="btn btn-primary btn-sm shadow-sm" [routerLink]="['/roles/list']">

            <i class="bi bi-arrow-left me-1"></i>
            Volver

        </a>

    </div>

    <!-- CONTENT -->
    <div class="row g-4">

        <!-- LEFT -->
        <div class="col-lg-8">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body p-4">

                    <!-- ROLE NAME -->
                    <div class="mb-4">

                        <label for="name" class="form-label fw-semibold">
                            Nombre del Rol
                        </label>

                        <input type="text" class="form-control form-control-sm" id="name" formControlName="name"
                            [value]="role_data.name" disabled />

                    </div>

                    <!-- PERMISSIONS -->
                    <div>

                        <label class="form-label fw-semibold">
                            Permisos
                        </label>

                        <div *ngIf="hasPermissions(); else allPermissionsTpl">

                            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 mt-1">

                                <div *ngFor="let module of role_data.permissions" class="col">

                                    <div class="card border h-100">

                                        <div class="card-body p-3">

                                            <h6 class="fw-bold text-primary mb-3">
                                                {{ module.module }}
                                            </h6>

                                            <div *ngFor="let perm of module.permissions" class="form-check mb-2">

                                                <input type="checkbox" class="form-check-input"
                                                    [checked]="perm.assigned" disabled />

                                                <label class="form-check-label small">

                                                    {{ perm.display_name }}

                                                    <small class="text-muted">
                                                        ({{ perm.name }})
                                                    </small>

                                                </label>

                                            </div>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <ng-template #allPermissionsTpl>

                            <div class="alert alert-light border mt-2 mb-0">
                                No hay permisos asignados.
                            </div>

                        </ng-template>

                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT -->
        <div class="col-lg-4">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h6 class="fw-bold mb-4">
                        Información del registro
                    </h6>

                    <div class="mb-3">

                        <label class="form-label fw-semibold" for="created_at">

                            Creado el

                        </label>

                        <input type="text" id="created_at" class="form-control form-control-sm"
                            [value]="role_data.created_at || 'N/A'" disabled />

                    </div>

                    <div>

                        <label class="form-label fw-semibold" for="updated_at">

                            Actualizado el

                        </label>

                        <input type="text" id="updated_at" class="form-control form-control-sm"
                            [value]="role_data.updated_at || 'N/A'" disabled />

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
