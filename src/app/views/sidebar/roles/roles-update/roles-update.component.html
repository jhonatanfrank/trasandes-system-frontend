<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">

    <div *ngFor="let t of toasts" class="toast align-items-center text-white border-0 mb-2"
        [class.bg-success]="t.type === 'success'" [class.bg-danger]="t.type === 'error'" [class.show]="t.visible"
        [class.fade]="true">

        <div class="d-flex">

            <div class="toast-body">
                {{ t.message }}
            </div>

            <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="t.visible = false">
            </button>

        </div>

    </div>

</div>


<div *ngIf="loading" class="text-center mt-4">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>

    <p class="mt-2 text-muted">
        Cargando Rol y Permisos...
    </p>
</div>


<div *ngIf="!loading && role_data" class="container-fluid px-4 mt-4 mb-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-shield-lock text-primary me-2"></i>
                {{ role_data.name }}
            </h3>

            <small class="text-muted">
                Detalle completo del rol
            </small>
        </div>

        <a class="btn btn-primary btn-sm shadow-sm" [routerLink]="['/roles/list']">

            <i class="bi bi-arrow-left me-1"></i>
            Volver

        </a>

    </div>

    <!-- CONTENT -->
    <div class="row g-4">

        <!-- LEFT -->
        <div class="col-lg-12">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body p-4">

                    <!-- ROLE NAME -->
                    <div class="mb-4">

                        <label for="name" class="form-label fw-semibold">
                            Nombre del Rol
                        </label>

                        <input type="text" class="form-control form-control-sm" id="name"
                            [(ngModel)]="role_data.name" />

                    </div>

                    <!-- PERMISSIONS -->
                    <div>

                        <label class="form-label fw-semibold">
                            Permisos
                        </label>

                        <div *ngIf="hasPermissions(); else allPermissionsTpl">

                            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 mt-1">

                                <div *ngFor="let module of role_data.permissions" class="col">

                                    <div class="card border h-100 shadow-sm">

                                        <div class="card-body p-3">

                                            <h6 class="fw-bold text-primary mb-3">
                                                {{ module.module }}
                                            </h6>

                                            <div *ngFor="let perm of module.permissions; let i = index"
                                                class="form-check mb-2">

                                                <input type="checkbox" class="form-check-input"
                                                    [id]="'perm-' + module.module + '-' + i"
                                                    [(ngModel)]="perm.assigned" />

                                                <label class="form-check-label small cursor-pointer"
                                                    [for]="'perm-' + module.module + '-' + i">

                                                    {{ perm.display_name }}

                                                    <small class="text-muted">
                                                        ({{ perm.name }})
                                                    </small>

                                                </label>

                                            </div>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <ng-template #allPermissionsTpl>

                            <div class="alert alert-light border mt-2 mb-0">
                                No hay permisos asignados.
                            </div>

                        </ng-template>

                    </div>

                </div>

            </div>
            a
        </div>
        <div class="d-flex justify-content-end mt-3">
            <button type="button" class="btn btn-primary btn-sm shadow-sm" (click)="updateRole()" [disabled]="saving">
                <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>

                <i class="bi bi-save me-1" *ngIf="!saving"></i>

                {{ saving ? 'Guardando...' : 'Guardar' }}
            </button>
        </div>

    </div>

</div>
