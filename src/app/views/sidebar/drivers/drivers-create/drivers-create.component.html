<!-- TOASTS -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
  <div *ngFor="let t of toasts" class="toast align-items-center text-white border-0 mb-2"
    [class.bg-success]="t.type === 'success'" [class.bg-danger]="t.type === 'error'" [class.show]="t.visible"
    [class.fade]="true" role="alert">

    <div class="d-flex">
      <div class="toast-body">
        {{ t.message }}
      </div>

      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="t.visible = false">
      </button>
    </div>
  </div>
</div>

<!-- HEADER -->
<div class="container-fluid mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-0">
        <i class="bi bi-person-plus text-primary me-2"></i>
        Crear Conductor
      </h3>
      <small class="text-muted">Formulario de registro de conductor</small>
    </div>

    <a class="btn btn-primary btn-sm shadow-sm" [routerLink]="['/drivers/list']">
      <i class="bi bi-arrow-left me-1"></i> Volver
    </a>
  </div>

  <!-- CARD FORM -->
  <div class="card border-0 shadow-sm rounded-3 mb-4">

    <div class="card-header bg-white border-bottom">
      <ul class="nav nav-tabs card-header-tabs">
        <li class="nav-item">
          <button class="nav-link active">
            <i class="bi bi-info-circle me-1"></i> Información
          </button>
        </li>
      </ul>
    </div>

    <div class="card-body">

      <form [formGroup]="form" (ngSubmit)="create()">

        <div class="row g-4">

          <!-- USER -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Usuario</label>

            <div class="input-group shadow-sm">
              <span class="input-group-text bg-light">
                <i class="bi bi-person text-primary"></i>
              </span>

              <select class="form-select" formControlName="user_id"
                [ngClass]="{ 'is-invalid': f['user_id'].touched && f['user_id'].invalid }">

                <option value="" disabled selected>
                  Selecciona un usuario
                </option>

                <option *ngFor="let user of users" [value]="user.id">
                  {{ user.name }}
                </option>

              </select>
            </div>

            <small class="text-danger" *ngIf="f['user_id'].touched && f['user_id'].invalid">
              Debes seleccionar un usuario
            </small>
          </div>

          <!-- LICENCIA -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Licencia</label>
            <div class="input-group shadow-sm">
              <span class="input-group-text bg-light">
                <i class="bi bi-card-text text-primary"></i>
              </span>
              <input type="text" class="form-control" formControlName="licencia"
                [ngClass]="{ 'is-invalid': f['licencia'].touched && f['licencia'].invalid }" />
            </div>
            <small class="text-danger" *ngIf="f['licencia'].touched && f['licencia'].invalid">
              La licencia es obligatoria
            </small>
          </div>

          <!-- NÚMERO LICENCIA -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Número Licencia</label>
            <div class="input-group shadow-sm">
              <span class="input-group-text bg-light">
                <i class="bi bi-hash text-primary"></i>
              </span>
              <input type="text" class="form-control" formControlName="numero_licencia"
                [ngClass]="{ 'is-invalid': f['numero_licencia'].touched && f['numero_licencia'].invalid }" />
            </div>
            <small class="text-danger" *ngIf="f['numero_licencia'].touched && f['numero_licencia'].invalid">
              El número de licencia es obligatorio
            </small>
          </div>

          <!-- VENCIMIENTO -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Vencimiento licencia</label>
            <div class="input-group shadow-sm">
              <span class="input-group-text bg-light">
                <i class="bi bi-calendar-x text-primary"></i>
              </span>
              <input type="date" class="form-control" formControlName="vencimiento_licencia"
                [ngClass]="{ 'is-invalid': f['vencimiento_licencia'].touched && f['vencimiento_licencia'].invalid }">
            </div>
            <small class="text-danger" *ngIf="f['vencimiento_licencia'].touched && f['vencimiento_licencia'].invalid">
              La fecha es obligatoria
            </small>
          </div>

          <!-- ESTADO -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Estado conductor</label>
            <div class="input-group shadow-sm">
              <span class="input-group-text bg-light">
                <i class="bi bi-info-circle text-primary"></i>
              </span>

              <select class="form-select" formControlName="estado_conductor">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
          </div>

        </div>

        <!-- BOTÓN -->
        <div class="mt-4 d-flex justify-content-end">
          <button class="btn btn-primary shadow-sm px-4" type="submit" [disabled]="loading">
            <i class="bi bi-save me-1"></i>
            {{ loading ? 'Guardando...' : 'Crear conductor' }}
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
