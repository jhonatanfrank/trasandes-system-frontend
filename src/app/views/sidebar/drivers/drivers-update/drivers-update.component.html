<!-- LOADING GLOBAL -->
<div *ngIf="loadingDriver" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
    <p class="text-muted mt-2">Cargando conductor...</p>
</div>

<div *ngIf="!loadingDriver">

    <!-- TOASTS -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div *ngFor="let t of toasts" class="toast align-items-center text-white border-0 mb-2"
            [class.bg-success]="t.type === 'success'" [class.bg-danger]="t.type === 'error'" [class.show]="t.visible">

            <div class="d-flex">
                <div class="toast-body">{{ t.message }}</div>
                <button class="btn-close btn-close-white me-2 m-auto" (click)="t.visible = false"></button>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-4">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h3 class="fw-bold mb-0">
                    <i class="bi text-primary bi-pencil-square me-2"></i>
                    Editar Conductor
                </h3>
                <small class="text-muted">Actualiza la información del conductor</small>
            </div>

            <a class="btn btn-primary btn-sm" [routerLink]="['/drivers/list']">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>

        </div>

        <!-- CARD -->
        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <form [formGroup]="form" (ngSubmit)="update()">

                    <div class="row g-4">

                        <!-- USER -->
                        <div class="col-md-6">

                            <label class="form-label fw-semibold">Usuario</label>

                            <div class="input-group input-group-sm">

                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <select class="form-select" formControlName="user_id"
                                    [class.is-invalid]="f['user_id'].invalid && f['user_id'].touched"
                                    [class.is-valid]="f['user_id'].valid && f['user_id'].touched">

                                    <option [ngValue]="null" disabled>
                                        {{ loadingUsers ? 'Cargando usuarios...' : 'Seleccione usuario' }}
                                    </option>

                                    <option *ngFor="let u of users" [ngValue]="u.id">
                                        {{ u.name }}
                                    </option>

                                </select>

                                <!-- SPINNER -->
                                <span *ngIf="loadingUsers" class="input-group-text bg-white">
                                    <div class="spinner-border spinner-border-sm text-primary"></div>
                                </span>

                            </div>

                            <small class="text-danger" *ngIf="f['user_id'].touched && f['user_id'].invalid">
                                Usuario obligatorio
                            </small>

                        </div>

                        <!-- LICENCIA -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Licencia</label>

                            <input class="form-control form-control-sm" formControlName="licencia"
                                [class.is-invalid]="f['licencia'].invalid && f['licencia'].touched">

                            <small class="text-danger" *ngIf="f['licencia'].touched && f['licencia'].invalid">
                                Licencia obligatoria
                            </small>
                        </div>

                        <!-- NUMERO -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Número licencia</label>

                            <input class="form-control form-control-sm" formControlName="numero_licencia"
                                [class.is-invalid]="f['numero_licencia'].invalid && f['numero_licencia'].touched">

                            <small class="text-danger"
                                *ngIf="f['numero_licencia'].touched && f['numero_licencia'].invalid">
                                Número obligatorio
                            </small>
                        </div>

                        <!-- FECHA -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Vencimiento</label>

                            <input type="date" class="form-control form-control-sm"
                                formControlName="vencimiento_licencia"
                                [class.is-invalid]="f['vencimiento_licencia'].invalid && f['vencimiento_licencia'].touched">

                            <small class="text-danger"
                                *ngIf="f['vencimiento_licencia'].touched && f['vencimiento_licencia'].invalid">
                                Fecha obligatoria
                            </small>
                        </div>

                        <!-- ESTADO -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estado</label>

                            <select class="form-select form-select-sm" formControlName="estado_conductor">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>

                    </div>

                    <!-- BUTTON -->
                    <div class="mt-4 text-end">

                        <button class="btn btn-primary btn-sm px-4" type="submit" [disabled]="loading">

                            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>

                            {{ loading ? 'Actualizando...' : 'Actualizar' }}

                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
