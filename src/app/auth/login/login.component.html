<!-- Toast Bootstrap -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
  <div class="toast align-items-center text-white border-0" [class.bg-success]="toastType === 'success'"
    [class.bg-danger]="toastType === 'error'" [class.show]="toastVisible" [class.fade]="true" role="alert">
    <div class="d-flex">
      <div class="toast-body">
        {{ toastMessage }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastVisible = false"></button>
    </div>
  </div>
</div>

<section class="h-100">
  <div class="container h-100">
    <div class="row justify-content-sm-center h-100">
      <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9">
        <div class="text-center my-5">
          <img src="https://getbootstrap.com/docs/5.0/assets/brand/bootstrap-logo.svg" alt="logo" width="100">
        </div>
        <div class="card shadow-lg">
          <div class="card-body p-5">
            <h1 class="fs-4 card-title fw-bold mb-4">Login</h1>
            <form #loginForm="ngForm" (ngSubmit)="login()" class="needs-validation" novalidate autocomplete="off">
              <div class="mb-3">
                <label class="mb-2 text-muted" for="email">E-Mail</label>
                <input [(ngModel)]="user" id="email" type="email" class="form-control" name="email" required email
                  #emailRef="ngModel">

                <div class="invalid-feedback" *ngIf="emailRef.invalid && emailRef.touched">
                  El email es inválido
                </div>
              </div>

              <div class="mb-3">
                <div class="mb-2 w-100">
                  <label class="text-muted" for="password">Contraseña</label>
                </div>

                <input [(ngModel)]="password" id="password" type="password" class="form-control" name="password"
                  required minlength="1" #passRef="ngModel">

                <div class="invalid-feedback" *ngIf="passRef.invalid && passRef.touched">
                  La contraseña es obligatoria
                </div>
              </div>

              <div class="d-flex justify-content-end mt-3">
                <button type="submit" [disabled]="isLoading || loginForm.invalid" cButton class="px-4" color="primary">
                  {{ isLoading ? 'Cargando...' : 'Ingresar' }}
                </button>
              </div>
            </form>

          </div>
          <div class="card-footer py-3 border-0">
            <div class="text-center">
              ¿Necesitas acceso? Comunicate con RRHH
              <!-- <a href="register.html" class="text-dark">Create One</a> -->
            </div>
          </div>
        </div>
        <div class="text-center mt-5 text-muted">
          Copyright &copy; 2017-2021 &mdash; Your Company
        </div>
      </div>
    </div>
  </div>
</section>
